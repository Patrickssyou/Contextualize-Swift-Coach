<title>QA Desk Calibration</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the existing QA Desk shell; audit in 4 stacked sections, the scorecard becomes a grid with one column per grader. */
:root{
  --bg:#fdf8f4; --panel:#ffffff; --ink:#1f1d2b; --muted:#6b6878; --line:#e6e1dc; --soft:#f4efea;
  --accent:#6d28d9; --accent-soft:#f3ebfd; --on-fill:#ffffff; --tp:#6f5bc4; --tp-soft:#f2effc;
  --s1:#dc2626; --s1-soft:#fef2f2; --s2:#b45309; --s2-soft:#fffbeb; --s3:#15803d; --s3-soft:#f0fdf4;
  --na:#6b6878; --na-soft:#efebe7;
  --pat:#0e7490; --pat-soft:#ecfeff; --howard:#c2410c; --howard-soft:#fff7ed; --liqi:#be185d; --liqi-soft:#fdf2f8;
  --f-body:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1820; --panel:#232030; --ink:#eeecf5; --muted:#a29fb0; --line:#37334a; --soft:#2a2638;
  --accent:#a78bfa; --accent-soft:#2b2440; --on-fill:#1a1820; --tp:#a595e6; --tp-soft:#272041;
  --s1:#f87171; --s1-soft:#33201f; --s2:#d9ab4d; --s2-soft:#2e2718; --s3:#6cc296; --s3-soft:#1a2b21;
  --na:#a29fb0; --na-soft:#2a2638;
  --pat:#5fc7da; --pat-soft:#16303a; --howard:#f0965e; --howard-soft:#3a2416; --liqi:#f07aae; --liqi-soft:#3a1a2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1820; --panel:#232030; --ink:#eeecf5; --muted:#a29fb0; --line:#37334a; --soft:#2a2638;
  --accent:#a78bfa; --accent-soft:#2b2440; --on-fill:#1a1820; --tp:#a595e6; --tp-soft:#272041;
  --s1:#f87171; --s1-soft:#33201f; --s2:#d9ab4d; --s2-soft:#2e2718; --s3:#6cc296; --s3-soft:#1a2b21;
  --na:#a29fb0; --na-soft:#2a2638;
  --pat:#5fc7da; --pat-soft:#16303a; --howard:#f0965e; --howard-soft:#3a2416; --liqi:#f07aae; --liqi-soft:#3a1a2a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:grid;gap:16px}
.main{display:grid;gap:16px;min-width:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:13px}

/* mockup controls */
.mock{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 14px;border:1px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft)}
.mock b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-fill)}
.mgrp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mgrp span{font-size:13px;color:var(--muted)}

/* app header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.here{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:800;color:var(--panel);flex:none}
.av.pat{background:var(--pat)}.av.howard{background:var(--howard)}.av.liqi{background:var(--liqi)}.av.claude{background:var(--tp)}
.avs{display:flex}.avs .av{border:2px solid var(--bg);margin-left:-6px}.avs .av:first-child{margin-left:0}
.live{width:8px;height:8px;border-radius:50%;background:var(--s3);display:inline-block}

/* sections */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sechd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sechd h2{font-size:16px}
.sechd .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.secbd{padding:14px 16px;display:grid;gap:14px}

/* ticket */
.tk{display:grid;grid-template-columns:1fr auto;gap:12px 20px;align-items:start}
.tk h1{font-size:20px;letter-spacing:-.01em}
.tkmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p1{background:var(--s1-soft);color:var(--s1)}.warn{background:var(--s2-soft);color:var(--s2)}.ok{background:var(--s3-soft);color:var(--s3)}.mut{background:var(--na-soft);color:var(--na)}.acc{background:var(--accent-soft);color:var(--accent)}
.verd{text-align:right}
.verd .big{font-size:28px;font-weight:800;line-height:1}
.ttabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 16px}
.ttabs button{border:0;background:none;padding:8px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:14px}
.ttabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* evidence */
.ev{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.brief{margin:0;padding-left:18px;display:grid;gap:6px}
.brief li::marker{color:var(--accent)}
.src{display:grid;gap:8px;align-content:start}
.srow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.srow .ic{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);flex:none}
.srow .t{min-width:0;flex:1}
.srow .t b{display:block;font-size:14px}
.srow .t span{font-size:12px;color:var(--muted)}
.srow a{font-size:13px;font-weight:600;white-space:nowrap}
.more{font-size:13px;color:var(--accent);font-weight:600;border:0;background:none;padding:0;justify-self:start}

/* scorecard */
.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-size:14px}
.status .r{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-fill)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.scroll{overflow-x:auto}
table.sc{width:100%;border-collapse:collapse;min-width:760px}
.sc th,.sc td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.sc th:first-child,.sc td:first-child{text-align:left;padding-left:16px}
.sc thead th{font-size:12px;font-weight:700;color:var(--muted);background:var(--panel);position:sticky;top:0}
.colh{display:inline-flex;align-items:center;gap:6px}
.sc td.me{background:var(--accent-soft)}
.sc thead th.me{color:var(--accent)}
.crit b{font-size:14px;font-weight:600}
.crit .sub{display:block;font-size:12px;color:var(--muted)}
.mk{display:inline-grid;place-items:center;min-width:30px;height:28px;border-radius:7px;font-family:var(--f-mono);font-weight:700;font-size:14px;padding:0 6px}
.m0,.m1{background:var(--s1-soft);color:var(--s1)}.m2{background:var(--s2-soft);color:var(--s2)}.m3,.m4{background:var(--s3-soft);color:var(--s3)}.mna{background:var(--na-soft);color:var(--na);font-size:12px}
.hid{color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:4px}
.picks{display:inline-flex;gap:3px}
.picks button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-mono);font-weight:700;font-size:13px;padding:0}
.picks button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-fill)}
.note{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 4px;margin-left:2px}
.note.has{color:var(--accent);font-weight:700}
.spread{white-space:nowrap}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--soft)}
tr.row:hover td.me{background:var(--accent-soft)}
tr.det td{background:var(--bg);text-align:left;padding:12px 16px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.nt{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel);display:grid;gap:4px;align-content:start}
.nt header{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.nt p{margin:0;font-size:14px}
.nt.empty p{color:var(--muted)}
.agree{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.agree textarea,.mynote textarea{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px}
.mynote{display:flex;gap:10px;align-items:flex-start}
tfoot td{font-weight:800;border-bottom:0;background:var(--soft)}
.tot{font-family:var(--f-mono);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;padding:10px 16px;font-size:13px;color:var(--muted)}

.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.outc{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;background:var(--bg)}
.outc h3{font-size:14px}
.outc ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px}

/* coaching */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.cc{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;background:var(--bg)}
.cc h3{font-size:14px}
.cc p{margin:0;font-size:14px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.wchips li{background:var(--s3-soft);color:var(--s3);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}

/* calibration tab */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);display:grid;gap:4px}
.kpi .v{font-size:24px;font-weight:800}
table.list{width:100%;border-collapse:collapse;min-width:640px}
.list th,.list td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.list th{font-size:12px;color:var(--muted)}
.dots{display:inline-flex;gap:4px}
.dot{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;border:2px solid var(--line);color:var(--muted)}
.dot.done.pat{background:var(--pat);border-color:var(--pat);color:var(--panel)}
.dot.done.howard{background:var(--howard);border-color:var(--howard);color:var(--panel)}
.dot.done.liqi{background:var(--liqi);border-color:var(--liqi);color:var(--panel)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.track{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.fill{height:100%;border-radius:5px;background:var(--s2)}
.fill.lo{background:var(--s3)}.fill.hi{background:var(--s1)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

@media (max-width:760px){.ev,.two,.tk{grid-template-columns:1fr}.verd{text-align:left}.here{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.btn,.picks button{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
  <div class="mock" role="group" aria-label="Mockup controls">
    <b>Mockup</b>
    <div class="mgrp"><span>Viewing as</span><div class="seg" id="mWho"></div></div>
    <div class="mgrp"><span>Stage</span><div class="seg" id="mStage"></div></div>
    <div class="mgrp"><span>Type</span><div class="seg" id="mKind"></div></div>
    <span class="hint">Example data. Nothing here is saved.</span>
  </div>

  <header class="top">
    <div class="brand">QA Desk</div>
    <nav class="tabs" id="kindTabs" aria-label="Section"></nav>
    <nav class="tabs" id="subTabs" aria-label="View"></nav>
    <div class="here" id="here"></div>
  </header>

  <main id="main" class="main"></main>
</div>

<script>
const PEOPLE={pat:{name:"Pat",ini:"P"},howard:{name:"Howard",ini:"H"},liqi:{name:"Li Qi",ini:"LQ"}};
const RATERS=["pat","howard","liqi"];
const DATA={
 chat:{
  title:"Wrong pizza, client wants comp",sa:"Ivo (example)",place:"Bella Forno (example)",when:"Oct 9 · 6:42 PM",type:"Compensation",prio:"P1",
  claudePct:72,
  brief:["Client says the 6:05 PM pickup order (ticket 4471) went out with the wrong pizza.","Ivo opened the order: it was voided at 6:20 PM, reason No pick up.","Ivo offered a 30% comp of $7.00 on the item subtotal, before checking the void.","The client pushed back; Ivo escalated to CRT after 14 minutes.","No comp amount was written in the chat, the note or the WIRA ticket."],
  sources:[["O","Order 4471","Pickup · $23.33 · Voided · No pick up","GreenDot ↗"],["C","Call with the store","3:12 · Oct 9, 6:31 PM","▶ Recording"],["W","WIRA ticket","Compensation · Closed","Open ↗"],["S","Slack thread","#pizza-crt · 4 replies","Open ↗"]],
  rubric:[["fr","First response",3,"Reply in 2 min"],["ev","Gathered the evidence",3],["rs","Restated the case correctly",3],["fa","Fault attribution",3],["path","Resolution path",3],["amt","Resolution accuracy",3],["expl","Solution explained",3],["esc","Escalation",4],["tone","Reply quality",3]],
  claude:{fr:3,ev:1,rs:3,fa:2,path:2,amt:0,expl:2,esc:4,tone:3},
  why:{fr:"Replied in 2 minutes.",ev:"Offered the comp before opening the order; the void was only found later.",rs:"Restated the wrong-pizza claim correctly.",fa:"Called it a restaurant error, but the order was voided as No pick up.",path:"A comp was the right path once the claim was confirmed.",amt:"No amount recorded anywhere; policy says fail it.",expl:"Explained the comp, not why the order was voided.",esc:"Escalated to CRT when the client pushed back.",tone:"Polite and clear."},
  r:{
   pat:{m:{fr:3,ev:1,rs:2,fa:1,path:2,amt:0,expl:2,esc:3,tone:3},n:{ev:"Didn't open the order before offering money. That's the bar.",fa:"Voided as no pick up means the client never collected. Not the store's fault.",esc:"Escalated late, 14 min of back and forth first.",rs:"Missed that it was a pickup order."}},
   howard:{m:{fr:3,ev:1,rs:3,fa:1,path:1,amt:0,expl:2,esc:4,tone:2},n:{fa:"Client's fault, order never picked up.",path:"No comp was due at all once it's a no pick up.",tone:"Too many apologies, sounded unsure."}},
   liqi:{m:{fr:3,ev:2,rs:3,fa:2,path:2,amt:0,expl:2,esc:4,tone:3},n:{ev:"He did open the order eventually, partial credit.",fa:"We can't be sure the store didn't mark it wrong. Shared.",amt:"Agree, nothing recorded."}}
  },
  agreed:{fr:[3,"All matched"],ev:[1,"Evidence comes before any offer."],rs:[3,"Pickup was mentioned once; minor."],fa:[1,"No pick up = client. Li Qi to confirm void reasons are reliable."],path:[1,"No comp due on a no pick up."],amt:[0,"All matched"],expl:[2,"All matched"],esc:[4,"Escalation itself was right; timing goes under Evidence."],tone:[3,"Apologies were fine for a P1."]}
 },
 call:{
  title:"Order not ready at pickup",sa:"Mara (example)",place:"Slice Lane (example)",when:"Oct 10 · 12:14 PM",type:"Order issue",prio:"P2",
  claudePct:81,
  brief:["Client called; the pickup order was not ready 20 minutes after the quoted time.","Mara called the store, which said the ticket never printed.","Mara had the store remake it and told the client 10 minutes.","She logged the ticket as Order issue with the printer cause.","She did not show the client how to check order status in CMA."],
  sources:[["▶","Call recording","6:48 · Oct 10, 12:14 PM","▶ Recording"],["C","Call to the store","1:55 · 12:19 PM","▶ Recording"],["O","Order 2210","Pickup · $31.10 · Submitted","GreenDot ↗"],["W","WIRA ticket","Order issue · Closed","Open ↗"]],
  rubric:[["1a","Opening spiel",3],["1b","Tone and dead air",3],["1c","Empathy and composure",3],["1d","Clear communication",3],["2a","Listened and gathered info",3],["2b","Root cause and fault",3],["2c","Immediate resolution",3],["2d","Long-term solution",3],["2e","Ticket documented",3],["3a","Ownership",3],["3b","Self-serve coaching",3],["3c","Next steps",3]],
  claude:{"1a":3,"1b":2,"1c":3,"1d":3,"2a":3,"2b":3,"2c":3,"2d":2,"2e":3,"3a":3,"3b":1,"3c":3},
  why:{"1b":"About 50 seconds of silence while calling the store.","2d":"Flagged the printer but didn't open a tech ticket.","3b":"Didn't coach on order status in CMA."},
  r:{
   pat:{m:{"1a":3,"1b":2,"1c":3,"1d":3,"2a":3,"2b":3,"2c":3,"2d":1,"2e":3,"3a":3,"3b":1,"3c":3},n:{"2d":"Printer failures need a tech ticket every time."}},
   howard:{m:{"1a":3,"1b":3,"1c":3,"1d":3,"2a":3,"2b":3,"2c":3,"2d":2,"2e":3,"3a":3,"3b":2,"3c":3},n:{"1b":"She said she'd put them on hold. Fine.","3b":"Coaching isn't expected on an urgent pickup."}},
   liqi:{m:{"1a":3,"1b":2,"1c":3,"1d":3,"2a":3,"2b":3,"2c":3,"2d":1,"2e":2,"3a":3,"3b":1,"3c":3},n:{"2e":"Intent right, but the summary misses the remake."}}
  },
  agreed:{}
 }
};
// call agreed: majority by default
Object.values(DATA).forEach(d=>d.rubric.forEach(([id])=>{if(d.agreed[id])return;const v=RATERS.map(k=>d.r[k].m[id]).sort();d.agreed[id]=[v[1],v[0]===v[2]?"All matched":"Settled on the call."]}));

const S={who:"pat",stage:"scoring",kind:"chat",tab:"audit",ttab:"ticket",open:new Set(),noteOpen:null,evMore:false};
// what the viewer has done in the scoring stage (Pat mid-way; Howard submitted; Li Qi not started)
const DRAFT={chat:{pat:{fr:3,ev:1,rs:2,fa:1},liqi:{}},call:{pat:{},liqi:{}}};
const SUBMITTED={pat:false,howard:true,liqi:false};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mcls=(v,max)=>v==null?"mna":v>=max?"m3":v===max-1?"m2":"m1";
const mk=(v,max)=>v==null?`<span class="mk mna">–</span>`:`<span class="mk ${mcls(v,max)}">${v}</span>`;
const av=k=>`<span class="av ${k}" title="${k==="claude"?"Claude":PEOPLE[k].name}">${k==="claude"?"C":PEOPLE[k].ini}</span>`;
const D=()=>DATA[S.kind];
function pct(marks){const d=D();let a=0,b=0;d.rubric.forEach(([id,,max])=>{const v=marks[id];if(v!=null){a+=v;b+=max}});return b?Math.round(a/b*100):null}
function myMarks(){const d=D();if(S.stage!=="scoring")return d.r[S.who].m;if(S.who==="howard")return d.r.howard.m;return DRAFT[S.kind][S.who]}
function scoredCount(){return RATERS.filter(k=>S.stage!=="scoring"||SUBMITTED[k]).length}

function seg(el,opts,key){el.innerHTML=opts.map(([v,l])=>`<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${S[key]===v}">${l}</button>`).join("")}
function render(){
  seg($("#mWho"),RATERS.map(k=>[k,PEOPLE[k].name]),"who");
  seg($("#mStage"),[["scoring","1 · Scoring"],["revealed","2 · Revealed"],["agreed","3 · Agreed"]],"stage");
  seg($("#mKind"),[["chat","WIRA chat"],["call","Call"]],"kind");
  $("#kindTabs").innerHTML=[["chat","Chats"],["call","Calls"]].map(([v,l])=>`<button type="button" role="tab" data-k="kind" data-v="${v}" aria-selected="${S.kind===v}">${l}</button>`).join("");
  $("#subTabs").innerHTML=[["dash","Dashboard"],["audit","Audit"],["calib","Calibration"],["learn","Learning"]].map(([v,l])=>`<button type="button" role="tab" data-k="tab" data-v="${v}" aria-selected="${S.tab===v}"${v==="dash"||v==="learn"?" disabled title=\"Unchanged\"":""}>${l}</button>`).join("");
  const others=RATERS.filter(k=>k!==S.who);
  $("#here").innerHTML=`<span class="live" aria-hidden="true"></span><span class="avs">${av(S.who)}${av(others[0])}</span><span>You and ${PEOPLE[others[0]].name} are here</span>`;
  $("#main").innerHTML=S.tab==="calib"?calib():audit();
}

/* ---------- AUDIT ---------- */
function audit(){const d=D();return ticket(d)+evidence(d)+scorecard(d)+coaching(d)}
function ticket(d){
  const showC=S.stage!=="scoring",fin=S.stage==="agreed";
  const p=fin?pct(Object.fromEntries(Object.entries(d.agreed).map(([k,v])=>[k,v[0]]))):showC?d.claudePct:null;
  return `<section class="sec" aria-label="Ticket">
  <div class="secbd"><div class="tk"><div>
    <div class="lbl">${S.kind==="chat"?"WIRA chat":"Call"} · ${esc(d.when)}</div>
    <h1>${esc(d.title)}</h1>
    <div class="tkmeta"><span>${esc(d.sa)}</span><span>${esc(d.place)}</span><span class="pill acc">${esc(d.type)}</span><span class="pill ${d.prio==="P1"?"p1":"warn"}">${d.prio}</span></div>
  </div><div class="verd">${p==null?`<div class="lbl">Score</div><div class="hid">Hidden until reveal</div>`:`<div class="lbl">${fin?"Agreed score":"Claude's score"}</div><div class="big num">${p}%</div><div class="hint">${p>=90?"Great":p>=80?"Good":p>=65?"Okay":p>=50?"Needs work":"Miss"}</div>`}</div></div></div>
  <div class="ttabs" role="tablist"><button type="button" role="tab" aria-selected="true">Ticket</button><button type="button" role="tab" aria-selected="false">${S.kind==="chat"?"Chat":"Transcript"}</button></div>
  </section>`}
function evidence(d){
  return `<section class="sec" aria-label="Evidence"><div class="sechd"><h2>Evidence</h2></div><div class="secbd"><div class="ev">
   <div><div class="lbl" style="margin-bottom:6px">What happened</div><ul class="brief">${d.brief.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div>
   <div class="src"><div class="lbl">Sources</div>${d.sources.map(([i,t,s,l])=>`<div class="srow"><span class="ic">${esc(i)}</span><div class="t"><b>${esc(t)}</b><span>${esc(s)}</span></div><a href="#" onclick="return false">${esc(l)}</a></div>`).join("")}
   <button type="button" class="more">Timeline and full sources</button></div>
  </div></div></section>`}

function scorecard(d){
  const st=S.stage,me=S.who,mine=myMarks(),done=scoredCount(),iSub=st!=="scoring"||SUBMITTED[me];
  const cols=[...RATERS];
  const head=`<tr><th>Criterion</th><th><span class="colh">${av("claude")}Claude</span></th>${cols.map(k=>`<th class="${k===me?"me":""}"><span class="colh">${av(k)}${k===me?"You":PEOPLE[k].name}</span></th>`).join("")}${st!=="scoring"?`<th>Spread</th><th>Agreed</th>`:""}</tr>`;
  const rows=d.rubric.map(([id,label,max,sub])=>{
    const claudeCell=st==="scoring"?`<span class="hid">🔒 Hidden</span>`:mk(d.claude[id],max);
    const cells=cols.map(k=>{
      if(k===me&&st==="scoring"&&!iSub){const v=mine[id];const hasN=!!(d.r[me].n[id]&&S.kind==="chat"&&me==="pat"&&v!=null);
        return `<td class="me"><span class="picks" role="group" aria-label="${esc(label)}">${[...Array(max+1).keys()].map(x=>`<button type="button" data-pick="${id}" data-v="${x}" aria-pressed="${v===x}">${x}</button>`).join("")}</span><button type="button" class="note ${hasN?"has":""}" data-note="${id}" aria-label="Add a note">${hasN?"Note ✓":"+ Note"}</button></td>`}
      if(st==="scoring"){const sub=k===me?true:SUBMITTED[k];
        if(k===me)return `<td class="me">${mk(mine[id],max)}</td>`;
        return `<td><span class="hid">${sub?"✓ Scored":"Not yet"}</span></td>`}
      const v=d.r[k].m[id],n=d.r[k].n[id];return `<td class="${k===me?"me":""}">${mk(v,max)}${n?`<span class="note has" aria-hidden="true">✎</span>`:""}</td>`});
    let extra="";
    if(st!=="scoring"){const vs=cols.map(k=>d.r[k].m[id]),sp=Math.max(...vs)-Math.min(...vs),ag=d.agreed[id];
      const claudeOff=st==="agreed"?d.claude[id]!==ag[0]:Math.abs(d.claude[id]-[...vs].sort()[1])>=1;
      extra=`<td class="spread">${sp===0?`<span class="pill ok">Match</span>`:sp===1?`<span class="pill warn">1 apart</span>`:`<span class="pill p1">${sp} apart</span>`}</td>
      <td>${st==="agreed"||sp===0?`${mk(ag[0],max)}`:`<button type="button" class="btn" data-open="${id}">Settle</button>`}${claudeOff&&st==="agreed"?`<div class="hint" style="font-size:11px">Claude off</div>`:""}</td>`}
    const open=S.open.has(id)&&st!=="scoring";
    let det="";
    if(open){det=`<tr class="det"><td colspan="${st!=="scoring"?7:5}"><div class="notes">
      <div class="nt"><header>${av("claude")}Claude · ${mk(d.claude[id],max)}</header><p>${esc(d.why[id]||"No reason given.")}</p></div>
      ${cols.map(k=>{const n=d.r[k].n[id];return `<div class="nt ${n?"":"empty"}"><header>${av(k)}${PEOPLE[k].name} · ${mk(d.r[k].m[id],max)}</header><p>${esc(n||"No note.")}</p></div>`}).join("")}</div>
      <div class="agree"><span class="lbl">Agreed</span><span class="picks">${[...Array(max+1).keys()].map(x=>`<button type="button" aria-pressed="${d.agreed[id][0]===x&&st==="agreed"}">${x}</button>`).join("")}</span><textarea rows="1" aria-label="Why we agreed">${st==="agreed"?esc(d.agreed[id][1]):""}</textarea><button type="button" class="btn primary">Save</button></div></td></tr>`}
    if(S.noteOpen===id&&st==="scoring"&&!iSub){det=`<tr class="det"><td colspan="5"><div class="mynote">${av(me)}<textarea rows="2" aria-label="Your note on ${esc(label)}" placeholder="Why this mark">${esc(me==="pat"&&S.kind==="chat"?d.r.pat.n[id]||"":"")}</textarea><button type="button" class="btn" data-note="${id}">Done</button></div></td></tr>`}
    return `<tr class="${st!=="scoring"?"row":""}" data-row="${id}"><td class="crit"><b>${esc(label)}</b>${sub?`<span class="sub">${esc(sub)}</span>`:""}</td><td>${claudeCell}</td>${cells.join("")}${extra}</tr>`+det}).join("");
  const tot=st==="scoring"?"":`<tfoot><tr><td>Score</td><td class="tot">${d.claudePct}%</td>${cols.map(k=>`<td class="tot ${k===me?"me":""}">${pct(d.r[k].m)}%</td>`).join("")}<td></td><td class="tot">${st==="agreed"?pct(Object.fromEntries(Object.entries(d.agreed).map(([k,v])=>[k,v[0]])))+"%":"–"}</td></tr></tfoot>`;
  const filled=Object.keys(mine).length,need=d.rubric.length;
  const unsettled=st==="revealed"?d.rubric.filter(([id])=>{const vs=RATERS.map(k=>d.r[k].m[id]);return Math.max(...vs)!==Math.min(...vs)}).length:0;
  const status=st==="scoring"?
    `<div class="status"><span><b>${done} of 3</b> scored. Everyone's marks and Claude's open when all 3 are in.</span><span class="dots">${RATERS.map(k=>`<span class="dot ${SUBMITTED[k]?"done":""} ${k}" title="${PEOPLE[k].name}">${PEOPLE[k].ini}</span>`).join("")}</span>
      <span class="r">${iSub?`<button type="button" class="btn">Edit my marks</button>`:`<span class="hint num">${filled}/${need}</span><button type="button" class="btn primary"${filled<need?" disabled":""}>Submit my marks</button>`}</span></div>`:
    st==="revealed"?`<div class="status"><span><b>Revealed.</b> ${unsettled} of ${d.rubric.length} rows to settle. Click a row to see everyone's notes.</span><span class="r"><button type="button" class="btn primary" disabled>Lock agreed score</button></span></div>`:
    `<div class="status"><span><b>Agreed</b> by Pat, Howard and Li Qi on Oct 14. This is the score the SA sees.</span><span class="r"><button type="button" class="btn">Reopen</button></span></div>`;
  const out=st==="agreed"?outcome(d):"";
  return `<section class="sec" aria-label="Scorecard"><div class="sechd"><h2>Scorecard</h2><div class="r"><span class="hint">Round 1 · item 4 of 15</span></div></div>${status}
   <div class="scroll"><table class="sc"><thead>${head}</thead><tbody>${rows}</tbody>${tot}</table></div>${out}</section>`}
function outcome(d){
  const off=d.rubric.filter(([id])=>d.claude[id]!==d.agreed[id][0]);
  const per=RATERS.map(k=>[k,d.rubric.filter(([id])=>d.r[k].m[id]===d.agreed[id][0]).length]);
  return `<div class="secbd"><div class="out">
   <div class="outc"><h3>Sent to the coach</h3><ul>${off.length?off.map(([id,l,max])=>`<li>${esc(l)}: Claude ${d.claude[id]}, agreed ${d.agreed[id][0]}</li>`).join(""):"<li>Claude matched every agreed mark.</li>"}</ul><span class="hint">Each becomes a lesson with the agreed reason.</span></div>
   <div class="outc"><h3>Who matched the agreed mark</h3><ul>${per.map(([k,n])=>`<li>${PEOPLE[k].name}: ${n} of ${d.rubric.length}</li>`).join("")}<li>Claude: ${d.rubric.length-off.length} of ${d.rubric.length}</li></ul></div>
  </div></div>`}
function coaching(d){
  const fin=S.stage==="agreed";
  return `<section class="sec" aria-label="Coaching"><div class="sechd"><h2>Coaching</h2><div class="r">${fin?`<button type="button" class="btn">Copy all</button>`:`<span class="hint">Written from the agreed score</span>`}</div></div>
   <div class="secbd">${fin?(S.kind==="chat"?`<ul class="wchips"><li>Fast first reply</li><li>Clear, polite tone</li><li>Escalated to CRT</li></ul>
   <div class="cards"><div class="cc"><h3>Open the order before offering money</h3><p>The order was voided as No pick up. Checking it first would have shown no comp was due.</p></div>
   <div class="cc"><h3>Name the fault from the order data</h3><p>No pick up means the client didn't collect. Say that plainly and offer to reorder.</p></div></div>`:
   `<ul class="wchips"><li>Called the store fast</li><li>Clear next steps</li></ul><div class="cards"><div class="cc"><h3>Open a tech ticket for printer failures</h3><p>A ticket that never printed will happen again. Log it so tech can fix the printer.</p></div></div>`):`<p class="hint" style="margin:0">Coaching appears once the score is agreed.</p>`}</div></section>`}

/* ---------- CALIBRATION TAB ---------- */
function calib(){
  const items=[["chat","Wrong pizza, client wants comp","Ivo","revealed",[1,1,1]],["chat","Late delivery, refund ask","Sam","agreed",[1,1,1]],["chat","Coupon not applied","Rhea","scoring",[0,1,0]],["call","Order not ready at pickup","Mara","agreed",[1,1,1]],["chat","Double charge","Ivo","scoring",[1,1,0]],["call","Wrong address","Jon","scoring",[0,0,1]],["chat","Missing item","Ana","agreed",[1,1,1]],["call","Menu price wrong","Rhea","scoring",[0,0,0]]];
  const bars=[["Fault attribution",62],["Resolution path",48],["Evidence before action",40],["Reply quality",22],["First response",4]];
  return `<section class="sec"><div class="sechd"><h2>Round 1</h2><div class="r"><span class="hint">10 chats and 5 calls · Oct 13 to Oct 17</span><button type="button" class="btn primary">New round</button></div></div>
   <div class="secbd">
    <div class="kpis">
     <div class="kpi"><span class="lbl">Agreed</span><span class="v num">6 / 15</span><span class="hint">3 waiting to settle</span></div>
     <div class="kpi"><span class="lbl">Same mark, all 3</span><span class="v num">71%</span><span class="hint">of criteria, on agreed items</span></div>
     <div class="kpi"><span class="lbl">Claude vs agreed</span><span class="v num">78%</span><span class="hint">criteria matched</span></div>
     <div class="kpi"><span class="lbl">Your turn</span><span class="v num">4</span><span class="hint">items you haven't scored</span></div>
    </div>
    <div class="two">
     <div><div class="lbl" style="margin-bottom:8px">Where we disagree most</div><div class="bars">${bars.map(([l,v])=>`<div class="bar"><span>${l}</span><span class="track"><span class="fill ${v>=50?"hi":v<15?"lo":""}" style="width:${v}%;display:block"></span></span><span class="num">${v}%</span></div>`).join("")}</div><p class="hint">Share of rows where the 3 marks weren't all the same.</p></div>
     <div><div class="lbl" style="margin-bottom:8px">Each grader vs the agreed mark</div><div class="bars">${[["pat",84],["howard",76],["liqi",80],["claude",78]].map(([k,v])=>`<div class="bar"><span class="colh">${av(k)}${k==="claude"?"Claude":PEOPLE[k].name}</span><span class="track"><span class="fill lo" style="width:${v}%;display:block"></span></span><span class="num">${v}%</span></div>`).join("")}</div></div>
    </div>
    <div class="scroll"><table class="list"><thead><tr><th>Item</th><th>Type</th><th>SA</th><th>Scored</th><th>Stage</th></tr></thead><tbody>
     ${items.map(([k,t,sa,st,dn])=>`<tr><td><a href="#" data-k="tab" data-v="audit">${esc(t)}</a></td><td>${k==="chat"?"Chat":"Call"}</td><td>${sa}</td><td><span class="dots">${RATERS.map((r,i)=>`<span class="dot ${dn[i]?"done":""} ${r}" title="${PEOPLE[r].name}">${PEOPLE[r].ini}</span>`).join("")}</span></td><td>${st==="agreed"?`<span class="pill ok">Agreed</span>`:st==="revealed"?`<span class="pill warn">To settle</span>`:`<span class="pill mut">Scoring</span>`}</td></tr>`).join("")}
    </tbody></table></div>
   </div></section>`}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-k]");if(t){e.preventDefault();if(t.disabled)return;S[t.dataset.k]=t.dataset.v;if(t.dataset.k==="kind"||t.dataset.k==="stage")S.open.clear();render();return}
  const p=e.target.closest("[data-pick]");if(p){DRAFT[S.kind][S.who][p.dataset.pick]=+p.dataset.v;render();return}
  const n=e.target.closest("[data-note]");if(n){S.noteOpen=S.noteOpen===n.dataset.note?null:n.dataset.note;render();return}
  const r=e.target.closest("[data-open]")||e.target.closest("tr.row");if(r){const id=r.dataset.open||r.dataset.row;S.open.has(id)?S.open.delete(id):S.open.add(id);render()}
});
render();
</script>
